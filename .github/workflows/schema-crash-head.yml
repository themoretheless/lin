name: schema-crash-head-functional
on:
  push:
    branches: [codex/schema-crash-head-ci]
permissions:
  contents: read
jobs:
  schema-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify frozen corrected source and regression tests
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,hashlib
          m=json.loads(Path('benches/results/2026-10-27-schema-crash-head/candidate-source.json').read_text())
          for name,digest in m.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PYCODE
      - name: Full release suite including schema subprocess crashes and negative metadata controls
        run: |
          mkdir -p benches/results/ci-schema-crash-head
          set -o pipefail
          cargo test --release --lib --tests -- --nocapture 2>&1 | tee benches/results/ci-schema-crash-head/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-crash-head-linux
          path: benches/results/ci-schema-crash-head/
          if-no-files-found: error
