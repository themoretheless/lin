name: WAL FULL Linux phase profile
on:
  push:
    branches: [codex/wal-full-linux-profile]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - run: cargo build --locked --release -p lin-peer-worker --bin fresh_wal_profile
      - name: Measure and validate phase traces
        run: |
          set -o pipefail
          mkdir -p wal-profile
          git rev-parse HEAD > wal-profile/provenance.txt
          uname -a >> wal-profile/provenance.txt
          rustc -Vv >> wal-profile/provenance.txt
          sha256sum target/release/fresh_wal_profile >> wal-profile/provenance.txt
          python3 scripts/bench-wal-profile.py target/release/fresh_wal_profile wal-profile | tee wal-profile/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-full-linux-profile
          path: wal-profile/
