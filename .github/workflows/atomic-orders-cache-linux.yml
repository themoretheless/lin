name: atomic-orders-cache-linux
on:
  push:
    branches: [codex/current-candidate-public-peers-20261103]
    paths:
      - '.github/workflows/atomic-orders-cache-linux.yml'
      - 'examples/orders_probe.rs'
      - 'benches/results/2026-11-03-atomic-orders-cache-linux/*.py'
      - 'benches/results/2026-11-03-atomic-orders-cache-linux/input.json'
      - 'benches/results/2026-11-03-atomic-orders-cache-linux/plan.json'
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_NET_RETRY: 5
      CARGO_HTTP_MULTIPLEXING: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen baseline
        run: git fetch --no-tags --depth=1 origin a28aa758b774e216f14a6348fb1cf9dca2eb42bc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify native lifecycle syscall and standard resource module
        run: python3 scripts/bench-native-lifecycle.py --preflight
      - name: Default workspace correctness before timing
        run: cargo test --locked --workspace > /tmp/lin-atomic-orders-cache-workspace.txt 2>&1
      - name: Build identical example harness and qualify mutation phases
        run: python3 benches/results/2026-11-03-atomic-orders-cache-linux/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-orders-cache-linux
          path: |
            /tmp/lin-atomic-orders-cache-linux/
            /tmp/lin-atomic-orders-cache-workspace.txt
          if-no-files-found: error
