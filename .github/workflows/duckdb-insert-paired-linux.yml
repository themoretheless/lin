name: Profile first and warm INSERT on Linux
on:
  push:
    branches: [codex/duckdb-process-warmup]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, replica: amd-1}
          - {runner: ubuntu-22.04, replica: amd-2}
          - {runner: ubuntu-22.04, replica: amd-3}
          - {runner: ubuntu-22.04, replica: amd-4}
          - {runner: ubuntu-24.04-arm, replica: arm64}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record CPU and select target hosts
        id: cpu
        run: |
          lscpu > runner-cpu.txt
          if [[ "$(uname -m)" = aarch64 ]] || grep -Eq 'AMD EPYC (7763|9V74)' runner-cpu.txt; then
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.cpu.outputs.matched == 'true'
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-python@v6
        if: steps.cpu.outputs.matched == 'true'
        with:
          python-version: '3.14'
      - name: Build Lin peer worker and install pinned Python peers
        if: steps.cpu.outputs.matched == 'true'
        run: |
          cargo build --locked --release -p lin-peer-worker
      - name: Locate TCMalloc for the allocation control
        if: steps.cpu.outputs.matched == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libtcmalloc-minimal4
          library=$(ldconfig -p | awk '/libtcmalloc_minimal\.so\.4 / { print $NF }' | head -1)
          test -f "$library"
          echo "LIN_BENCH_TCMALLOC=$library" >> "$GITHUB_ENV"
          dpkg-query -W libtcmalloc-minimal4 > allocator-provenance.txt
          sha256sum "$library" >> allocator-provenance.txt
      - name: Measure allocation and per-sample resource use
        if: steps.cpu.outputs.matched == 'true'
        run: |
          set -o pipefail
          git rev-parse HEAD > duckdb-provenance.txt
          uname -a >> duckdb-provenance.txt
          lscpu >> duckdb-provenance.txt
          rustc -Vv >> duckdb-provenance.txt
          sha256sum target/release/lin-peer-worker >> duckdb-provenance.txt
          python3 scripts/profile-insert-rusage.py target/release/lin-peer-worker duckdb-results.json | tee duckdb-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-duckdb-insert-${{ matrix.replica }}
          path: |
            runner-cpu.txt
            allocator-provenance.txt
            duckdb-results.json
            duckdb-summary.txt
            duckdb-provenance.txt
