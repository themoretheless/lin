name: Pair glibc huge-page hint against DuckDB
on:
  push:
    branches: [codex/duckdb-process-warmup]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, replica: amd-1}
          - {runner: ubuntu-22.04, replica: amd-2}
          - {runner: ubuntu-22.04, replica: amd-3}
          - {runner: ubuntu-22.04, replica: amd-4}
          - {runner: ubuntu-24.04-arm, replica: arm64}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record CPU and select target hosts
        id: cpu
        run: |
          lscpu > runner-cpu.txt
          if [[ "$(uname -m)" = aarch64 ]] || grep -Eq 'AMD EPYC (7763|9V74|9V45)' runner-cpu.txt; then
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.cpu.outputs.matched == 'true'
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-python@v6
        if: steps.cpu.outputs.matched == 'true'
        with:
          python-version: '3.14'
      - name: Verify profiling patch
        if: steps.cpu.outputs.matched == 'true'
        run: |
          git apply --check scripts/profile-insert-components.patch
      - name: Record huge-page and glibc settings
        if: steps.cpu.outputs.matched == 'true'
        run: |
          cat /sys/kernel/mm/transparent_hugepage/enabled >> allocator-provenance.txt
          loader=$(ldd /bin/ls | awk '/ld-linux/ { print $1 }')
          "$loader" --list-tunables > glibc-tunables.txt
          grep -q '^glibc.malloc.hugetlb:' glibc-tunables.txt
      - name: Profile shape setup in row-building workers
        if: steps.cpu.outputs.matched == 'true'
        run: |
          git apply scripts/profile-insert-components.patch
          cargo build --locked --release -p lin-peer-worker
          python3 scripts/profile-insert-stages.py target/release/lin-peer-worker > stages.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-duckdb-insert-${{ matrix.replica }}
          path: |
            runner-cpu.txt
            allocator-provenance.txt
            glibc-tunables.txt
            stages.json
