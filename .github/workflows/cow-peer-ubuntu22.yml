name: cow-peer-ubuntu22
on:
  push:
    branches: [codex/cow-peer-ubuntu22-ci]
permissions:
  contents: read
jobs:
  peers:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/cow-peer-ubuntu22'
          cache-on-failure: true
      - name: Verify frozen harness and source blobs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('benches/results/2026-11-02-corrected-cow-peer-ubuntu22')
          m=json.loads((p/'input.json').read_text())
          for name,digest in m['files_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          assert {str(f):hashlib.sha256(f.read_bytes()).hexdigest()for f in Path('src').rglob('*.rs')}==m['restore_source_sha256']
          PY
          python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/source-overlay.py --verify-inputs
      - name: Verify kernel and exact Mongo readiness prerequisite
        run: python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/check-host.py
      - name: Install exact corrected runtime source
        run: python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/source-overlay.py
      - name: Install pinned bindings and verify harness contracts
        run: |
          python3 -m pip install -r scripts/bench-peers-requirements.lock
          python3 -m pip freeze > benches/results/2026-11-02-corrected-cow-peer-ubuntu22/python-packages.txt
          python3 scripts/test-bench-peers.py > benches/results/2026-11-02-corrected-cow-peer-ubuntu22/harness-tests.log 2>&1
      - name: Fetch exact previously recorded server images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          m=json.loads(Path('benches/results/2026-11-02-corrected-cow-peer-ubuntu22/input.json').read_text())
          for ref in m['images'].values():subprocess.run(['docker','pull',ref],check=True)
          PY
      - name: Build exact625 peer executable with default release profile
        run: python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/build.py
      - name: Complete read and native insertion matrices
        run: python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/run.py
      - name: Verify owned containers absent
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('benches/results/2026-11-02-corrected-cow-peer-ubuntu22');f=p/'environment.json'
          if f.exists():
              m=json.loads(f.read_text());checks=[]
              for value in m['containers'].values():
                  r=subprocess.run(['docker','inspect',value['id']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  checks.append(dict(container_id=value['id'],inspect_exit=r.returncode));assert r.returncode==1
              (p/'cleanup-proof.json').write_text(json.dumps(dict(containers=checks,all_owned_containers_absent=all(r['inspect_exit']==1 for r in checks)),indent=2)+'\n')
          PY
      - name: Audit all observations values and original processes
        run: |
          python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/audit.py
          python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/verify-processes.py
          python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/write-report.py
      - name: Enforce unchanged available-peer process win gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path('benches/results/2026-11-02-corrected-cow-peer-ubuntu22/audit.json').read_text())
          for s in a['summary'].values():
              assert s['wins']==s['comparisons'] and s['positive_processes']==s['process_comparisons'],'Available-peer gate failed; retain all losses'
          PY
      - name: Restore incoming checkout source
        if: always()
        run: python3 benches/results/2026-11-02-corrected-cow-peer-ubuntu22/source-overlay.py --restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cow-peer-ubuntu22
          path: benches/results/2026-11-02-corrected-cow-peer-ubuntu22/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cow-peer-ubuntu22-exact-linux-executable
          path: /tmp/lin-cow-corrected-peer-built
          if-no-files-found: warn
