name: Linux release binaries
on:
  push:
    branches: [codex/profile-insert-allocator-pages]
    paths:
      - scripts/build-linux-release.sh
      - .github/workflows/linux-release-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-22.04]
        replica: [1, 2, 3]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - name: Build and verify allocator in both binaries
        run: |
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            (cd "$RUNNER_TEMP" && apt-get download libgoogle-perftools-dev)
            dpkg-deb -x "$RUNNER_TEMP"/libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
            export LIN_TCMALLOC_ARCHIVE="$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a"
          fi
          scripts/build-linux-release.sh
          for binary in target/release/{lin,lin-peer-worker}; do
            nm --defined-only "$binary" > "$RUNNER_TEMP/symbols"
            if [[ "$(uname -m)" = x86_64 ]]; then
              grep -Eq ' [TW] tc_malloc$' "$RUNNER_TEMP/symbols"
              grep -Eq ' [TW] malloc$' "$RUNNER_TEMP/symbols"
            elif grep -Eq ' [TW] tc_malloc$' "$RUNNER_TEMP/symbols"; then
              exit 1
            fi
          done
          lscpu > cpu.txt
          for trial in 1 2 3 4; do
            echo '{"insert_rows":100000,"samples":3,"timestamp_ms":123456}' |
              target/release/lin-peer-worker 2> "memory-$trial.jsonl" |
              jq -e '.result | length == 100000'
            jq -es '([.[]|select(has("stage"))]|length == 6) and ([.[]|select(has("phase"))]|length == 120)' "memory-$trial.jsonl"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.replica }}
          path: |
            cpu.txt
            memory-*.jsonl
