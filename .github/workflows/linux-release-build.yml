name: Linux release binaries
on:
  push:
    branches: [codex/profile-wal-buffer-growth]
    paths:
      - scripts/build-linux-release.sh
      - .github/workflows/linux-release-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - {runner: ubuntu-22.04, replica: x64-1}
          - {runner: ubuntu-22.04, replica: x64-2}
          - {runner: ubuntu-22.04, replica: x64-3}
          - {runner: ubuntu-24.04-arm, replica: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - name: Build and verify allocator in both binaries
        run: |
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            (cd "$RUNNER_TEMP" && apt-get download libgoogle-perftools-dev)
            dpkg-deb -x "$RUNNER_TEMP"/libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
            export LIN_TCMALLOC_ARCHIVE="$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a"
          fi
          scripts/build-linux-release.sh
          for binary in target/release/{lin,lin-peer-worker}; do
            nm --defined-only "$binary" > "$RUNNER_TEMP/symbols"
            if [[ "$(uname -m)" = x86_64 ]]; then
              grep -Eq ' [TW] tc_malloc$' "$RUNNER_TEMP/symbols"
              grep -Eq ' [TW] malloc$' "$RUNNER_TEMP/symbols"
            elif grep -Eq ' [TW] tc_malloc$' "$RUNNER_TEMP/symbols"; then
              exit 1
            fi
          done
          lscpu > cpu.txt
          python3 scripts/profile-wal-insert.py target/release/lin-peer-worker 6 > phases.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: wal-phases-${{ matrix.replica }}
          path: |
            cpu.txt
            phases.jsonl
