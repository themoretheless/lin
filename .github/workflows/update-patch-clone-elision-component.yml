name: update-patch-clone-elision-component
on:
  push:
    branches: [codex/update-patch-clone-elision-ci]
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify frozen source and component assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('benches/results/2026-11-01-update-patch-clone-elision')
          for name,digest in json.loads((p/'frozen-inputs.json').read_text()).items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Validate synthetic matrix and failure sensitivity
        run: python3 benches/results/2026-11-01-update-patch-clone-elision/test-protocol.py
      - name: Full release suite
        run: python3 benches/results/2026-11-01-update-patch-clone-elision/test.py
      - name: Reject incorrect derived and explicit hash guard mutants
        run: python3 benches/results/2026-11-01-update-patch-clone-elision/check-mutants.py
      - name: Build ordinary paired binaries
        run: python3 benches/results/2026-11-01-update-patch-clone-elision/build.py
      - name: Validate all 28 fresh correctness smokes
        run: python3 benches/results/2026-11-01-update-patch-clone-elision/smoke.py
      - name: Record kernel and filesystem
        run: |
          uname -a > benches/results/2026-11-01-update-patch-clone-elision/linux-environment.txt
          findmnt -T /tmp -o TARGET,SOURCE,FSTYPE,OPTIONS >> benches/results/2026-11-01-update-patch-clone-elision/linux-environment.txt
      - name: Run 504 isolated paired processes
        run: python3 benches/results/2026-11-01-update-patch-clone-elision/run.py
      - name: Recompute complete raw matrix
        run: python3 benches/results/2026-11-01-update-patch-clone-elision/analyze.py
      - name: Enforce frozen component gate
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('benches/results/2026-11-01-update-patch-clone-elision/qualification.json'))
          assert q['measurement_complete'] and q['component_gate_passes'],'Component failed: retain all raw observations'
          assert not q['full_engine_qualified'] and not q['full_objective_achieved']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-patch-clone-elision-component
          path: benches/results/2026-11-01-update-patch-clone-elision/
          if-no-files-found: error
