name: Fused column insert with WAL FULL
on:
  push:
    branches: [codex/qualify-fused-column-20261118]
    paths:
      - .github/workflows/bench-fused-column-wal-linux.yml
      - scripts/bench-fused-column-wal.py
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - run: cargo build --locked --release -p lin-peer-worker
      - name: Measure WAL FULL and reopen every database
        run: |
          set -o pipefail
          git rev-parse HEAD > provenance.txt
          uname -a >> provenance.txt
          lscpu >> provenance.txt
          sha256sum target/release/lin-peer-worker >> provenance.txt
          python3 scripts/bench-fused-column-wal.py target/release/lin-peer-worker results.json | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fused-column-wal-linux
          path: |
            provenance.txt
            results.json
            summary.txt
