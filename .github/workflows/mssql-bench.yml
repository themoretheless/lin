name: native-mssql-bench

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mssql-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-mssql:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned peer clients
        run: python -m pip install -r scripts/bench-peers-requirements.lock
      - name: Build frozen Lin peer worker
        run: |
          sudo apt-get update -qq
          (cd "$RUNNER_TEMP" && apt-get download libgoogle-perftools-dev)
          dpkg-deb -x "$RUNNER_TEMP"/libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
          export LIN_TCMALLOC_ARCHIVE="$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a"
          scripts/build-linux-release.sh > /tmp/lin-mssql-peer-build.log 2>&1
          nm --defined-only target/release/lin-peer-worker > "$RUNNER_TEMP/worker-symbols"
          grep -Eq ' [TW] tc_malloc$' "$RUNNER_TEMP/worker-symbols"
          lscpu | grep 'Model name:' 
      - name: Install artifact encryption
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Qualify real SQL Server on native x86
        run: python scripts/bench-mssql-native-ci.py --output "$RUNNER_TEMP/lin-mssql-private"
      - name: Encrypt internal qualification results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/lin-mssql-private" ]; then
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/lin-mssql-private.tar.gz" lin-mssql-private
            age -R .github/benchmark-recipients/mssql.age -o "$RUNNER_TEMP/lin-mssql-results.tar.gz.age" "$RUNNER_TEMP/lin-mssql-private.tar.gz"
            rm "$RUNNER_TEMP/lin-mssql-private.tar.gz"
          fi
      - name: Upload encrypted qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mssql-${{ github.run_id }}
          path: ${{ runner.temp }}/lin-mssql-results.tar.gz.age
          if-no-files-found: warn
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mssql-build-${{ github.run_id }}
          path: /tmp/lin-mssql-peer-build.log
          if-no-files-found: warn
