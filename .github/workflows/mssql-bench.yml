name: native-mssql-bench

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mssql-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-mssql:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned peer clients
        run: python -m pip install -r scripts/bench-peers-requirements.lock
      - name: Build frozen Lin peer worker
        run: cargo build --locked --release -p lin-peer-worker > /tmp/lin-mssql-peer-build.log 2>&1
      - name: Install artifact encryption
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Qualify real SQL Server on native x86
        run: python scripts/bench-mssql-native-ci.py --output "$RUNNER_TEMP/lin-mssql-private"
      - name: Encrypt internal qualification results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/lin-mssql-private" ]; then
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/lin-mssql-private.tar.gz" lin-mssql-private
            age -R .github/benchmark-recipients/mssql.age -o "$RUNNER_TEMP/lin-mssql-results.tar.gz.age" "$RUNNER_TEMP/lin-mssql-private.tar.gz"
            rm "$RUNNER_TEMP/lin-mssql-private.tar.gz"
          fi
      - name: Upload encrypted qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-mssql-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lin-mssql-results.tar.gz.age
            /tmp/lin-mssql-peer-build.log
          if-no-files-found: warn
