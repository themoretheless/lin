name: rollback-index-upsert
on:
  push:
    branches: [codex/rollback-index-upsert-ci]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target/rollback-index-upsert
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify frozen inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('benches/results/2026-11-01-rollback-index-upsert')
          for name,digest in json.loads((p/'frozen-inputs.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Full release tests
        run: python3 benches/results/2026-11-01-rollback-index-upsert/test.py
      - name: Compiled missing-index negative and exact baseline regression
        run: |
          python3 benches/results/2026-11-01-rollback-index-upsert/check-mutant.py
          python3 benches/results/2026-11-01-rollback-index-upsert/check-baseline.py
      - name: Build ordinary baseline and candidate and restore source
        run: python3 benches/results/2026-11-01-rollback-index-upsert/build.py
      - name: Synthetic complete matrix and corruption checks
        run: python3 benches/results/2026-11-01-rollback-index-upsert/test-protocol.py
      - name: All 28 fresh functional smoke checks
        run: python3 benches/results/2026-11-01-rollback-index-upsert/smoke.py
      - name: All 504 fresh paired processes
        run: python3 benches/results/2026-11-01-rollback-index-upsert/run.py
      - name: Analyze complete raw matrix
        id: analyze
        run: python3 benches/results/2026-11-01-rollback-index-upsert/analyze.py
      - name: Independent raw verification
        if: always() && steps.analyze.outcome == 'success'
        run: python3 benches/results/2026-11-01-rollback-index-upsert/verify.py
      - name: Enforce unchanged component thresholds
        if: always() && steps.analyze.outcome == 'success'
        run: python3 benches/results/2026-11-01-rollback-index-upsert/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-index-upsert
          path: benches/results/2026-11-01-rollback-index-upsert/
          if-no-files-found: error
