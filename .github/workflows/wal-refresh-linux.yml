name: Current local main WAL FULL benchmark
on:
  push:
    branches: [codex/wal-refresh-20261126]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - name: Profile WAL in a separate build
        run: |
          set -euo pipefail
          git apply scripts/wal-profile-refresh.patch
          cargo build --locked --release -p lin-peer-worker --bin fresh_wal_profile
          python3 scripts/bench-wal-profile.py target/release/fresh_wal_profile wal-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-profile-refresh-linux-${{ matrix.runner }}
          path: wal-profile/
