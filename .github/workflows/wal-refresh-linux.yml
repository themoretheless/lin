name: EPYC 9V74 WAL FULL phase comparison
on:
  push:
    branches: [codex/wal-refresh-20261126]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, replica: amd-1}
          - {runner: ubuntu-22.04, replica: amd-2}
          - {runner: ubuntu-22.04, replica: amd-3}
          - {runner: ubuntu-22.04, replica: amd-4}
          - {runner: ubuntu-22.04, replica: amd-5}
          - {runner: ubuntu-22.04, replica: amd-6}
    steps:
      - uses: actions/checkout@v4
      - name: Record CPU and select target hosts
        id: cpu
        run: |
          lscpu > runner-cpu.txt
          if grep -q 'AMD EPYC 9V74' runner-cpu.txt; then
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.cpu.outputs.matched == 'true'
        with:
          toolchain: '1.96.0'
      - name: Profile WAL build, maintenance and sync
        if: steps.cpu.outputs.matched == 'true'
        run: |
          set -euo pipefail
          git apply scripts/wal-profile-refresh.patch
          cargo build --locked --release -p lin-peer-worker --bin fresh_wal_profile
          git rev-parse HEAD > profile-revision.txt
          sha256sum target/release/fresh_wal_profile >> profile-revision.txt
          python3 scripts/profile-wal-9v74.py target/release/fresh_wal_profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-9v74-profile-${{ matrix.replica }}
          path: |
            runner-cpu.txt
            profile-revision.txt
            wal-9v74.json
