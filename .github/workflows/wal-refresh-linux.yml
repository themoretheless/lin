name: Current local main WAL FULL benchmark
on:
  push:
    branches: [codex/wal-refresh-20261126]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, replica: amd-1}
          - {runner: ubuntu-22.04, replica: amd-2}
          - {runner: ubuntu-22.04, replica: amd-3}
          - {runner: ubuntu-22.04, replica: amd-4}
          - {runner: ubuntu-22.04, replica: amd-5}
          - {runner: ubuntu-22.04, replica: amd-6}
          - {runner: ubuntu-22.04, replica: amd-7}
          - {runner: ubuntu-22.04, replica: amd-8}
    steps:
      - uses: actions/checkout@v4
      - name: Record CPU and select target hosts
        id: cpu
        run: |
          lscpu > runner-cpu.txt
          if [[ "$(uname -m)" = aarch64 ]] || grep -q 'AMD EPYC 9V74' runner-cpu.txt; then
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.cpu.outputs.matched == 'true'
        with:
          toolchain: '1.96.0'
      - name: Build locked release worker
        if: steps.cpu.outputs.matched == 'true'
        run: cargo build --locked --release -p lin-peer-worker --bin lin-peer-worker
      - name: Measure WAL FULL with paired controls
        if: steps.cpu.outputs.matched == 'true'
        run: |
          set -o pipefail
          git rev-parse HEAD > wal-provenance.txt
          uname -a >> wal-provenance.txt
          lscpu >> wal-provenance.txt
          rustc -Vv >> wal-provenance.txt
          sha256sum target/release/lin-peer-worker >> wal-provenance.txt
          cc -O2 -shared -fPIC -Wall -Wextra scripts/wal-sync-trace.c -ldl -o wal-sync-trace.so
          python3 scripts/profile-wal-sync.py target/release/lin-peer-worker wal-sync-trace.so wal-sync.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-epyc-${{ matrix.replica }}
          path: |
            runner-cpu.txt
            wal-sync.json
            wal-provenance.txt
