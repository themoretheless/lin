name: Current local main WAL FULL benchmark
on:
  push:
    branches: [codex/wal-refresh-20261120]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - name: Build locked release worker
        run: cargo build --locked --release -p lin-peer-worker --bin lin-peer-worker
      - name: Measure WAL FULL with paired controls
        run: |
          set -o pipefail
          git rev-parse HEAD > wal-provenance.txt
          uname -a >> wal-provenance.txt
          lscpu >> wal-provenance.txt
          rustc -Vv >> wal-provenance.txt
          sha256sum target/release/lin-peer-worker >> wal-provenance.txt
          python3 scripts/bench-wal-refresh.py target/release/lin-peer-worker scripts/bench-wal-full.py wal-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-refresh-linux-${{ matrix.runner }}
          path: |
            wal-results.json
            wal-provenance.txt
      - name: Profile critical-path phases in a separate binary
        run: |
          set -euo pipefail
          git apply scripts/wal-profile-refresh.patch
          cargo build --locked --release -p lin-peer-worker --bin fresh_wal_profile
          mkdir -p wal-profile
          sha256sum target/release/fresh_wal_profile > wal-profile/profile-sha256.txt
          python3 scripts/bench-wal-profile.py target/release/fresh_wal_profile wal-profile | tee wal-profile/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-profile-refresh-linux-${{ matrix.runner }}
          path: wal-profile/
