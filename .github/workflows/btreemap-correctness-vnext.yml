name: btreemap-correctness-vnext
on:
  push:
    branches: [codex/btreemap-correctness-vnext-ci]
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target/ci-btreemap-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify frozen BTreeMap reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('benches/results/2026-11-01-btreemap-correctness')
          for name,digest in json.loads((p/'frozen-inputs.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Full tests, six compiled negatives and full-value point oracle
        run: python3 benches/results/2026-11-01-btreemap-correctness/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btreemap-correctness-vnext
          path: benches/results/2026-11-01-btreemap-correctness/
          if-no-files-found: error
