name: linux-wal-keep-size-transaction-fixed
on:
  push:
    branches: [codex/linux-wal-reserve-tx-ci]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify and stage exact functional prototype
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,hashlib,shutil
          src=Path('benches/results/2026-10-27-linux-wal-keep-size-tx-fixed');dst=Path('benches/results/ci-linux-wal-keep-size-tx-fixed')
          m=json.loads((src/'input-provenance.json').read_text())
          for f,h in m['source_sha256'].items():assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h,f
          for f,h in m['build_inputs_sha256'].items():assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h,f
          dst.mkdir()
          for n,h in m['files_sha256'].items():
              assert hashlib.sha256((src/n).read_bytes()).hexdigest()==h,n
              shutil.copy2(src/n,dst/n)
          shutil.copy2(src/'input-provenance.json',dst/'input-provenance.json')
          PYCODE
      - name: Full release default suite including actual Linux reserve and replay oracles
        run: python3 benches/results/ci-linux-wal-keep-size-tx-fixed/test.py
      - name: Reject missing KEEP_SIZE at runtime and restore source
        run: python3 benches/results/ci-linux-wal-keep-size-tx-fixed/check-mutant.py
      - name: Independently verify actual kernel events and restored sources
        run: python3 benches/results/ci-linux-wal-keep-size-tx-fixed/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-wal-keep-size-transaction-fixed
          path: benches/results/ci-linux-wal-keep-size-tx-fixed/
          if-no-files-found: error
