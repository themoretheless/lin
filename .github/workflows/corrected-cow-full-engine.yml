name: corrected-cow-full-engine
on:
  push:
    branches: [codex/corrected-cow-full-engine-ci]
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Verify frozen runner and current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('benches/results/2026-11-01-corrected-cow-full-engine')
          for name,digest in json.loads((p/'frozen-runner.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
          python3 benches/results/2026-11-01-corrected-cow-full-engine/build.py --verify-inputs
      - name: Fetch and audit exact prerequisite artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('benches/results/2026-11-01-corrected-cow-full-engine')
          m=json.loads((p/'source-inputs.json').read_text())
          for role,name in [('baseline','btreemap-correctness-vnext'),('candidate','corrected-update-patch-correctness')]:
              root=p/'correctness-artifacts'/role;root.mkdir(parents=True)
              metadata=subprocess.check_output(['gh','run','view',str(m['correctness_runs'][role]),'--json','databaseId,headSha,status,conclusion,url'])
              (root/'run.json').write_bytes(metadata)
              info=json.loads(metadata);assert info['status']=='completed' and info['conclusion']=='success',role
              subprocess.run(['gh','run','download',str(m['correctness_runs'][role]),'--name',name,'--dir',str(root/'artifact')],check=True)
          PY
          python3 benches/results/2026-11-01-corrected-cow-full-engine/audit-prerequisites.py
      - name: Reject synthetic corruption and losing source gates
        run: python3 benches/results/2026-11-01-corrected-cow-full-engine/test-protocol.py
      - name: Build exact source roles in separate target directories
        run: python3 benches/results/2026-11-01-corrected-cow-full-engine/build.py
      - name: All 134 functional smoke checks
        run: python3 benches/results/2026-11-01-corrected-cow-full-engine/smoke.py
      - name: All 2412 fresh paired processes
        run: python3 benches/results/2026-11-01-corrected-cow-full-engine/run.py
      - name: Summarize complete matrix
        id: summarize
        run: python3 benches/results/2026-11-01-corrected-cow-full-engine/summarize.py
      - name: Independent raw verification
        if: always() && steps.summarize.outcome == 'success'
        run: python3 benches/results/2026-11-01-corrected-cow-full-engine/verify.py
      - name: Enforce unchanged source acceptance gate
        if: always() && steps.summarize.outcome == 'success'
        run: python3 benches/results/2026-11-01-corrected-cow-full-engine/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-cow-full-engine
          path: benches/results/2026-11-01-corrected-cow-full-engine/
          if-no-files-found: error
