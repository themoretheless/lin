name: transaction-wal-generation-functional
on:
  push:
    branches: [codex/durable-mutation-coverage-ci]
permissions:
  contents: read
jobs:
  transaction-wal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify fixed sources and run full release suite including subprocess crash recovery
        run: |
          mkdir -p benches/results/ci-tx-wal-generation
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,hashlib
          manifest=json.loads(Path('benches/results/2026-10-27-tx-wal-generation/candidate-source.json').read_text())
          for name,digest in manifest.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PYCODE
          set -o pipefail
          cargo test --release --lib --tests -- --nocapture 2>&1 | tee benches/results/ci-tx-wal-generation/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transaction-wal-generation-linux
          path: benches/results/ci-tx-wal-generation/
          if-no-files-found: error
