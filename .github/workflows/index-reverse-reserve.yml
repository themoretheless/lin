name: index-reverse-reserve
on:
  push:
    branches: [codex/index-reverse-reserve-ci]
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - name: Build and test standalone workers with immutable inputs
        run: python3 benches/results/2026-11-02-index-reverse-reserve/build.py
      - name: First balanced series
        env:
          SERIES: series1
        run: python3 benches/results/2026-11-02-index-reverse-reserve/measure.py
      - name: Independently audit first series
        run: python3 benches/results/2026-11-02-index-reverse-reserve/verify.py series1
      - name: Second balanced series
        env:
          SERIES: series2
        run: python3 benches/results/2026-11-02-index-reverse-reserve/measure.py
      - name: Independently audit second series
        run: python3 benches/results/2026-11-02-index-reverse-reserve/verify.py series2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-reverse-reserve
          path: benches/results/2026-11-02-index-reverse-reserve/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-reverse-exact-linux-executables
          path: /tmp/lin-index-reverse-base
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-reverse-candidate-exact-linux-executable
          path: /tmp/lin-index-reverse-cand
