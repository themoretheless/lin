name: Measure allocator size classes for INSERT
on:
  push:
    branches: [codex/profile-allocator-touch]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      matrix:
        runner: [ubuntu-22.04]
        replica: [1, 2, 3, 4]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Measure usable allocations on native Linux
        run: |
          set -eu
          lscpu | grep 'Model name' | tee cpu.txt
          link=()
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            apt-get download libgoogle-perftools-dev
            dpkg-deb -x libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
            link=(-Wl,-u,tc_malloc "$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a" -pthread)
          fi
          cat > measure.cpp <<'CPP'
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <chrono>
          #include <sys/resource.h>
          #include <vector>
          using Clock = std::chrono::steady_clock;
          int main(int argc, char** argv) {
              if (argc != 2) return 1;
              size_t size = std::strtoul(argv[1], nullptr, 10);
              std::vector<void*> live(100000);
              rusage before{}, after{};
              getrusage(RUSAGE_SELF, &before);
              auto start = Clock::now();
              for (auto& p : live) {
                  p = std::malloc(size);
                  if (!p) return 2;
                  std::memset(p, 42, 3072);
                  asm volatile("" : : "r"(p) : "memory");
              }
              auto ns = std::chrono::duration_cast<std::chrono::nanoseconds>(Clock::now()-start).count();
              getrusage(RUSAGE_SELF, &after);
              std::printf("%zu %lld %ld %ld\n",size,(long long)ns,after.ru_maxrss,after.ru_minflt-before.ru_minflt);
              for (auto p : live) std::free(p);
          }
          CPP
          c++ measure.cpp "${link[@]}" -o measure
          if [[ "$(uname -m)" = x86_64 ]]; then
            nm --defined-only measure > symbols
            grep -E ' [TW] (tc_malloc|malloc_usable_size|malloc)$' symbols
            grep -Eq ' [TW] tc_malloc$' symbols
          fi
          for i in {1..12}; do
            sizes=(3072 3088)
            if ((i % 2 == 0)); then sizes=(3088 3072); fi
            for size in "${sizes[@]}"; do ./measure "$size"; done
          done | tee measurements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.replica }}
          path: |
            measurements.txt
            cpu.txt
