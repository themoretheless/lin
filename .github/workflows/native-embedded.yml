name: Compare native embedded Rust clients

on:
  push:
    branches: [codex/profile-prefix-index-overlap]

permissions:
  contents: read

concurrency:
  group: native-embedded-${{ github.ref }}
  cancel-in-progress: false

jobs:
  peers:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Build frozen Lin peer worker
        run: |
          link=()
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            (cd "$RUNNER_TEMP" && apt-get download libgoogle-perftools-dev)
            dpkg-deb -x "$RUNNER_TEMP"/libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
            link=(-C link-arg=-Wl,-u,tc_malloc -C "link-arg=$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a" -C link-arg=-lstdc++)
          fi
          cargo rustc --no-default-features --features lin/wal-delta-trial --locked --release -p lin-peer-worker --bin embedded-native -- "${link[@]}"
          lscpu > cpu.txt
          for i in {1..12}; do
            for n in 1000 10000; do
              target/release/embedded-native lin-wal "$n" 1 "$(mktemp -d)" > "total-$n-$i.txt" 2> "stage-$n-$i.txt"
              grep -q '^encode ' "stage-$n-$i.txt"
              grep -q '^overlap ' "stage-$n-$i.txt"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-embedded-${{ matrix.runner }}
          path: |
            cpu.txt
            stage-*.txt
            total-*.txt
