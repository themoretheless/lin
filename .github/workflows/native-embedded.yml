name: Compare native embedded Rust clients

on:
  push:
    branches: [codex/typed-wal-x64-zero-blocks]

permissions:
  contents: read

concurrency:
  group: native-embedded-${{ github.ref }}
  cancel-in-progress: false

jobs:
  peers:
    strategy:
      matrix:
        runner: [ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned peer clients
        run: python -m pip install -r scripts/bench-peers-requirements.lock
      - name: Build frozen Lin peer worker
        run: |
          link=()
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            (cd "$RUNNER_TEMP" && apt-get download libgoogle-perftools-dev)
            dpkg-deb -x "$RUNNER_TEMP"/libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
            link=(-C link-arg=-Wl,-u,tc_malloc -C "link-arg=$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a" -C link-arg=-lstdc++)
          fi
          git show HEAD^:src/persist/codec.rs > src/persist/codec.rs
          cargo rustc --locked --release -p lin-peer-worker --bin embedded-native -- "${link[@]}"
          cp target/release/embedded-native target/release/typed-baseline
          git restore src/persist/codec.rs
          cargo rustc --locked --release -p lin-peer-worker --bin embedded-native -- "${link[@]}"
          lscpu > cpu.txt
          for n in 1000 10000; do
            for worker in typed-baseline embedded-native; do
              LIN_BENCH_EXPORT_WAL="$RUNNER_TEMP/$worker.wal" "target/release/$worker" lin-wal "$n" 1 "$(mktemp -d)"
            done
            cmp "$RUNNER_TEMP/typed-baseline.wal" "$RUNNER_TEMP/embedded-native.wal"
          done
          python scripts/typed-wal-triplets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-embedded-${{ matrix.runner }}
          path: |
            cpu.txt
            typed-wal-triplets.json
