name: Compare native embedded Rust clients

on:
  push:
    branches: [codex/typed-wal-syscall-profile]

permissions:
  contents: read

concurrency:
  group: native-embedded-${{ github.ref }}
  cancel-in-progress: false

jobs:
  peers:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned peer clients
        run: python -m pip install -r scripts/bench-peers-requirements.lock
      - name: Build frozen Lin peer worker
        run: |
          link=()
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            (cd "$RUNNER_TEMP" && apt-get download libgoogle-perftools-dev)
            dpkg-deb -x "$RUNNER_TEMP"/libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
            link=(-C link-arg=-Wl,-u,tc_malloc -C "link-arg=$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a" -C link-arg=-lstdc++)
          fi
          cargo rustc --locked --release -p lin-peer-worker --bin embedded-native -- "${link[@]}"
          lscpu > cpu.txt
          sudo apt-get update -qq
          sudo apt-get install -y strace
          mkdir traces
          for n in 1000 10000; do
            for i in {1..6}; do
              modes=(lin-wal sqlite)
              if (( i % 2 == 0 )); then modes=(sqlite lin-wal); fi
              for mode in "${modes[@]}"; do
                dir=$(mktemp -d)
                strace -f -ttt -T -yy -s 48 -e trace=write,writev,pwrite64,fdatasync,fsync,fallocate -o "traces/$mode-$n-$i.log" target/release/embedded-native "$mode" "$n" 1 "$dir" > "traces/$mode-$n-$i.json"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-embedded-${{ matrix.runner }}
          path: |
            cpu.txt
            traces/
