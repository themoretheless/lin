name: Compare native embedded Rust clients

on:
  push:
    branches: [codex/main-wal-delta-four-way]

permissions:
  contents: read

concurrency:
  group: native-embedded-${{ github.ref }}
  cancel-in-progress: false

jobs:
  peers:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Build frozen Lin peer worker
        run: |
          link=()
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            (cd "$RUNNER_TEMP" && apt-get download libgoogle-perftools-dev)
            dpkg-deb -x "$RUNNER_TEMP"/libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
            link=(-C link-arg=-Wl,-u,tc_malloc -C "link-arg=$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a" -C link-arg=-lstdc++)
          fi
          build_worker() {
            cargo rustc --no-default-features --locked --release -p lin-peer-worker --bin embedded-native "$@" -- "${link[@]}"
          }
          git show 3b967b4c5:src/persist/codec.rs > src/persist/codec.rs
          build_worker
          cp target/release/embedded-native target/release/typed-baseline
          git show 4a2f54e56:src/persist/codec.rs > src/persist/codec.rs
          build_worker --features lin/wal-delta-trial
          cp target/release/embedded-native target/release/typed-scalar
          git restore src/persist/codec.rs
          build_worker --features lin/wal-delta-trial
          for n in 1000 10000; do
            LIN_BENCH_EXPORT_WAL="$RUNNER_TEMP/wal-$n" target/release/embedded-native lin-wal "$n" 1 "$(mktemp -d)"
            LIN_BENCH_EXPORT_WAL="$RUNNER_TEMP/scalar-$n" target/release/typed-scalar lin-wal "$n" 1 "$(mktemp -d)"
            cmp "$RUNNER_TEMP/wal-$n" "$RUNNER_TEMP/scalar-$n"
          done
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          for size, codec in [(1000, 3), (10000, 3)]:
              data = (Path(os.environ["RUNNER_TEMP"]) / f"wal-{size}").read_bytes()
              start = 8 + int.from_bytes(data[4:8], "little")
              assert len(data) == {1000: 337083-86622, 10000: 3558455-922374}[size]
              assert data[start + 8] == codec
              assert start + 8 + int.from_bytes(data[start+4:start+8], "little") == len(data)
          PYCODE
          lscpu > cpu.txt
          python3 scripts/typed-wal-four-way.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-embedded-${{ matrix.runner }}
          path: |
            cpu.txt
            typed-wal-four-way.json
