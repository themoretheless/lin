name: rollback-fts-field-impact
on:
  push:
    branches: [codex/rollback-fts-field-impact-ci]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target/rollback-fts-field-impact
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/rollback-fts-field-impact'
          cache-on-failure: true
      - name: Verify frozen source and protocol
        run: python3 -c "from pathlib import Path;import hashlib,json;m=json.loads(Path('benches/results/2026-11-02-rollback-fts-field-impact-bench/frozen.json').read_text());assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in m.items())"
      - name: Role schedule properties
        run: python3 scripts/test-benchmark-role-balance.py
      - name: Full candidate release suite
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact/test-release.py
      - name: Both compiled FTS impact negatives
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact/check-mutants.py
      - name: Restored candidate focused checks
        run: cargo test --release --lib rollback_fts_ -- --nocapture > benches/results/2026-11-02-rollback-fts-field-impact/restored-focused.log 2>&1
      - name: Independent functional source and negative audit
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact/verify-functional.py
      - name: Synthetic complete matrix and corruption checks
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact-bench/test-protocol.py
      - name: Build serial source-bound pair and restore source
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact-bench/build.py
      - name: All forty fresh functional smokes
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact-bench/smoke.py
      - name: All 720 fresh paired processes
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact-bench/run.py
      - name: Analyze all 5760 observations
        id: analyze
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact-bench/analyze.py
      - name: Independent raw source command and numerical audit
        if: always() && steps.analyze.outcome == 'success'
        run: python3 benches/results/2026-11-02-rollback-fts-field-impact-bench/verify.py
      - name: Enforce unchanged component criteria
        if: always() && steps.analyze.outcome == 'success'
        run: python3 -c "from pathlib import Path;import json;p=Path('benches/results/2026-11-02-rollback-fts-field-impact-bench');assert json.loads((p/'independent-audit.json').read_text())['audit_complete'];assert json.loads((p/'qualification.json').read_text())['component_gate_passes']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-fts-field-impact
          path: |
            benches/results/2026-11-02-rollback-fts-field-impact/
            benches/results/2026-11-02-rollback-fts-field-impact-bench/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-fts-field-impact-exact-linux-executables
          path: |
            /tmp/lin-rollback-fts-field-impact-baseline
            /tmp/lin-rollback-fts-field-impact-candidate
          if-no-files-found: warn
