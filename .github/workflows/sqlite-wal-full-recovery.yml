name: SQLite WAL FULL with verified Lin recovery
on:
  push:
    branches: [codex/wal-full-x64-tcmalloc]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, replica: amd-1}
          - {runner: ubuntu-22.04, replica: amd-2}
          - {runner: ubuntu-22.04, replica: amd-3}
          - {runner: ubuntu-22.04, replica: amd-4}
          - {runner: ubuntu-24.04-arm, replica: arm64}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record CPU and select target hosts
        id: cpu
        run: |
          lscpu > runner-cpu.txt
          if [[ "$(uname -m)" = aarch64 ]] || grep -Eq 'AMD EPYC (7763|9V74|9V45)' runner-cpu.txt; then
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.cpu.outputs.matched == 'true'
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-python@v6
        if: steps.cpu.outputs.matched == 'true'
        with:
          python-version: '3.14'
      - name: Measure FULL-sync commits and verify recovery
        if: steps.cpu.outputs.matched == 'true'
        run: |
          set -o pipefail
          cargo build --locked --release -p lin-peer-worker
          git rev-parse HEAD > provenance.txt
          sha256sum target/release/lin-peer-worker >> provenance.txt
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y libtcmalloc-minimal4
            export LIN_X64_ALLOCATOR=$(ldconfig -p | awk '/libtcmalloc_minimal\.so\.4 / {print $NF; exit}')
            test -f "$LIN_X64_ALLOCATOR"
            sha256sum "$LIN_X64_ALLOCATOR" >> provenance.txt
          fi
          python3 scripts/bench-wal-full.py target/release/lin-peer-worker wal-full.json | tee summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-full-${{ matrix.replica }}
          path: |
            runner-cpu.txt
            provenance.txt
            wal-full.json
            summary.txt
