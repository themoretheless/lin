name: SQLite WAL FULL with verified Lin recovery
on:
  push:
    branches: [codex/trace-wal-reserve-range]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, replica: amd-1}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record CPU and select target hosts
        id: cpu
        run: |
          lscpu > runner-cpu.txt
          if [[ "$(uname -m)" = aarch64 ]] || [[ "$(uname -m)" = x86_64 ]]; then
            echo 'matched=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.cpu.outputs.matched == 'true'
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-python@v6
        if: steps.cpu.outputs.matched == 'true'
        with:
          python-version: '3.14'
      - name: Measure FULL-sync commits and verify recovery
        if: steps.cpu.outputs.matched == 'true'
        run: |
          set -o pipefail
          if [[ "$(uname -m)" = x86_64 ]]; then
            sudo apt-get update -qq
            (cd "$RUNNER_TEMP" && apt-get download libgoogle-perftools-dev)
            dpkg-deb -x "$RUNNER_TEMP"/libgoogle-perftools-dev_*.deb "$RUNNER_TEMP/perftools"
            export LIN_TCMALLOC_ARCHIVE="$RUNNER_TEMP/perftools/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.a"
          fi
          scripts/build-linux-release.sh
          if [[ "$(uname -m)" = x86_64 ]]; then
            for binary in target/release/{lin,lin-peer-worker}; do
              nm --defined-only "$binary" > symbols.txt
              grep -Eq ' [TW] malloc$' symbols.txt
              grep -Eq ' [TW] tc_malloc$' symbols.txt
              if ldd "$binary" | grep -q tcmalloc; then exit 1; fi
            done
          fi
          git rev-parse HEAD > provenance.txt
          sha256sum target/release/lin-peer-worker >> provenance.txt
          sudo apt-get install -y strace
          for n in 1000 10000; do
            mkdir "$RUNNER_TEMP/db-$n"
            echo "{\"insert_rows\":$n,\"samples\":1,\"timestamp_ms\":123456,\"durable_dir\":\"$RUNNER_TEMP/db-$n\"}" |
              strace -f -yy -e trace=fallocate,fsync,fdatasync -o "syscalls-$n.txt" target/release/lin-peer-worker |
              jq -e --argjson n "$n" '(.result | length) == $n and .reopen_ns[0] > 0'
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-full-${{ matrix.replica }}
          path: |
            runner-cpu.txt
            provenance.txt
            syscalls-*.txt
