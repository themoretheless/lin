name: cow-lazy-sharing-engine
on:
  push:
    branches: [codex/map-mutation-profile-ci]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify and stage frozen inputs
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,hashlib,shutil
          src=Path('benches/results/2026-10-27-cow-lazy-sharing-engine');dst=Path('benches/results/ci-cow-lazy-sharing-engine')
          m=json.loads((src/'input-provenance.json').read_text())
          for f,h in m['source_sha256'].items():assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h,f
          for f,h in m['build_inputs_sha256'].items():assert hashlib.sha256(Path(f).read_bytes()).hexdigest()==h,f
          assert hashlib.sha256(Path('benches/compare.rs').read_bytes()).hexdigest()==m['compare_sha256']
          dst.mkdir()
          for n,h in m['files_sha256'].items():
              assert hashlib.sha256((src/n).read_bytes()).hexdigest()==h,n
              shutil.copy2(src/n,dst/n)
          shutil.copy2(src/'input-provenance.json',dst/'input-provenance.json')
          PYCODE
      - name: Check analysis protocol with synthetic raw records
        run: python3 benches/results/ci-cow-lazy-sharing-engine/test-protocol.py
      - name: Functional tests for candidate source and restore sources
        run: python3 benches/results/ci-cow-lazy-sharing-engine/test.py
      - name: Build baseline and candidate binaries and restore sources
        run: python3 benches/results/ci-cow-lazy-sharing-engine/build.py
      - name: Run 1332 isolated processes with resource records
        run: python3 benches/results/ci-cow-lazy-sharing-engine/run.py
      - name: Summarize complete data
        id: summarize
        run: python3 benches/results/ci-cow-lazy-sharing-engine/summarize.py
      - name: Independent raw audit
        if: always() && steps.summarize.outcome == 'success'
        run: python3 benches/results/ci-cow-lazy-sharing-engine/verify.py
      - name: Enforce unchanged gate
        if: always() && steps.summarize.outcome == 'success'
        run: python3 benches/results/ci-cow-lazy-sharing-engine/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cow-lazy-sharing-engine
          path: benches/results/ci-cow-lazy-sharing-engine/
          if-no-files-found: error
