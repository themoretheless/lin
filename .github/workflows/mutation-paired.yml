name: mutation-paired
on:
  push:
    branches: [codex/mutation-borrowed-row-ci]
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify paired gate contract
        run: |
          python3 scripts/test-check-mutation-paired.py
          python3 scripts/test-cargo-bench-artifact.py
      - name: Prepare API-preserving static autocommit candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib
          src=Path('benches/results/2026-10-27-autocommit-pack-static-isolated')
          dst=Path('benches/results/ci-autocommit-pack-static-isolated')
          meta=json.loads((src/'input-provenance.json').read_text())
          assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in meta['before_sha256'].items())
          shutil.copytree(src,dst)
          PY
      - name: Check candidate, protocol and output sensitivity
        run: |
          python3 benches/results/ci-autocommit-pack-static-isolated/test-protocol.py
          python3 benches/results/ci-autocommit-pack-static-isolated/test.py
          python3 benches/results/ci-autocommit-pack-static-isolated/test-mutant.py
      - name: Build frozen baseline and candidate
        run: python3 benches/results/ci-autocommit-pack-static-isolated/build.py
      - name: Run two case-isolated six-round A-A-B series
        run: python3 benches/results/ci-autocommit-pack-static-isolated/run.py
      - name: Summarize all comparisons and evaluate unchanged gate
        id: qualify
        run: |
          python3 benches/results/ci-autocommit-pack-static-isolated/summarize.py
          python3 scripts/check-mutation-paired.py benches/results/ci-autocommit-pack-static-isolated update
      - name: Independently audit complete raw results
        if: ${{ always() && steps.qualify.outcome != 'skipped' }}
        run: python3 scripts/verify-case-isolated-mutation.py benches/results/ci-autocommit-pack-static-isolated
      - name: Preserve raw results including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-paired
          path: benches/results/ci-autocommit-pack-static-isolated/
          if-no-files-found: error
