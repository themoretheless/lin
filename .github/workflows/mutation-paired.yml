name: mutation-paired
on:
  push:
    branches: [codex/mutation-borrowed-row-ci]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Prepare frozen integrated COW phase diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil,json,hashlib
          src=Path('benches/results/2026-10-27-cow-integrated-fresh-profile')
          dst=Path('benches/results/ci-cow-integrated-fresh-profile')
          dst.mkdir()
          meta=json.loads((src/'input-provenance.json').read_text())
          assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in meta['before_sha256'].items())
          for name in ['build.py','run.py','probe.rs','analyze.py','protocol.md','input-provenance.json','cow-source-store.rs','cow-source-exec.rs','cow-source-check.rs']:
              shutil.copy2(src/name,dst/name)
          PY
      - name: Build phase diagnostic and restore production source
        run: python3 benches/results/ci-cow-integrated-fresh-profile/build.py
      - name: Profile real fresh UPDATE and DELETE fixtures
        run: python3 benches/results/ci-cow-integrated-fresh-profile/run.py
      - name: Verify raw phase records and summarize inclusive spans
        run: python3 benches/results/ci-cow-integrated-fresh-profile/analyze.py
      - name: Preserve diagnostic including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-paired
          path: benches/results/ci-cow-integrated-fresh-profile/
          if-no-files-found: error
