name: mutation-stage-profile
on:
  push:
    branches: [codex/mutation-borrowed-row-ci]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Prepare isolated diagnostic output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('benches/results/2026-10-27-linux-fresh-phase-input')
          dst=Path('benches/results/ci-fresh-phase')
          dst.mkdir()
          for name in ['build.py','run.py','probe.rs','report.md','cow-source-exec.rs','cow-source-store.rs','cow-source-check.rs']:
              shutil.copy2(src/name,dst/name)
          PY
      - name: Build instrumented frozen variants
        run: python3 benches/results/ci-fresh-phase/build.py
      - name: Profile existing fresh-fixture UPDATE path
        run: python3 benches/results/ci-fresh-phase/run.py
      - name: Preserve diagnostics including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-stage-profile
          path: benches/results/ci-fresh-phase/
          if-no-files-found: error
