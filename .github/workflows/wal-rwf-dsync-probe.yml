name: wal-rwf-dsync-probe
on:
  push:
    branches: [codex/wal-rwf-dsync-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /tmp/lin-rwf-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: Verify frozen source and protocol
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('benches/results/2026-10-28-wal-rwf-dsync-probe')
          for name,digest in json.loads((p/'frozen-inputs.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Record Linux filesystem and kernel
        run: |
          uname -a > benches/results/2026-10-28-wal-rwf-dsync-probe/linux-environment.txt
          findmnt -T /tmp -o TARGET,SOURCE,FSTYPE,OPTIONS >> benches/results/2026-10-28-wal-rwf-dsync-probe/linux-environment.txt
          df -T /tmp >> benches/results/2026-10-28-wal-rwf-dsync-probe/linux-environment.txt
      - name: Unit error paths and ordinary release probe build
        run: python3 benches/results/2026-10-28-wal-rwf-dsync-probe/build.py
      - name: Validate complete synthetic matrix and corruption sensitivity
        run: python3 benches/results/2026-10-28-wal-rwf-dsync-probe/test-matrix.py
      - name: Check all 24 fresh Linux golden replay smokes and syscall support
        run: python3 benches/results/2026-10-28-wal-rwf-dsync-probe/matrix.py smoke
      - name: Run 432 fresh paired processes
        run: python3 benches/results/2026-10-28-wal-rwf-dsync-probe/matrix.py run
      - name: Recompute every raw observation and gate
        run: python3 benches/results/2026-10-28-wal-rwf-dsync-probe/matrix.py analyze
      - name: Enforce frozen I/O probe gate
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('benches/results/2026-10-28-wal-rwf-dsync-probe/qualification.json'))
          assert q['io_gate_passes'],'I/O probe failed: retain all observations'
          assert not q['production_qualified'] and not q['full_objective_achieved']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wal-rwf-dsync-probe
          path: benches/results/2026-10-28-wal-rwf-dsync-probe/
          if-no-files-found: error
