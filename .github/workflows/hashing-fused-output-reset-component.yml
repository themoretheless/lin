name: hashing-fused-output-reset-component
on:
  push:
    branches: [codex/hashing-fused-output-reset-ci]
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify frozen source and component assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('benches/results/2026-10-28-hashing-fused-output-reset-component')
          for name,digest in json.loads((p/'frozen-inputs.json').read_text()).items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Validate synthetic matrix and failure sensitivity
        run: python3 benches/results/2026-10-28-hashing-fused-output-reset-component/test-protocol.py
      - name: Record Rust-visible CPUs
        run: |
          rustc benches/results/2026-10-28-hashing-fused-output-reset-component/host.rs -o /tmp/lin-fused-output-host
          /tmp/lin-fused-output-host > benches/results/2026-10-28-hashing-fused-output-reset-component/host.json
      - name: Full release suite
        run: python3 benches/results/2026-10-28-hashing-fused-output-reset-component/test.py
      - name: Reject coordinate and scratch reset mutations and restore source
        run: python3 benches/results/2026-10-28-hashing-fused-output-reset-component/check-mutants.py
      - name: Build ordinary paired binaries
        run: python3 benches/results/2026-10-28-hashing-fused-output-reset-component/build.py
      - name: Validate all 18 fresh correctness smokes
        run: python3 benches/results/2026-10-28-hashing-fused-output-reset-component/smoke.py
      - name: Record kernel and filesystem
        run: |
          uname -a > benches/results/2026-10-28-hashing-fused-output-reset-component/linux-environment.txt
          findmnt -T /tmp -o TARGET,SOURCE,FSTYPE,OPTIONS >> benches/results/2026-10-28-hashing-fused-output-reset-component/linux-environment.txt
      - name: Run 324 isolated paired processes
        run: python3 benches/results/2026-10-28-hashing-fused-output-reset-component/run.py
      - name: Recompute complete raw matrix
        run: python3 benches/results/2026-10-28-hashing-fused-output-reset-component/analyze.py
      - name: Enforce frozen component gate
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('benches/results/2026-10-28-hashing-fused-output-reset-component/qualification.json'))
          assert q['measurement_complete'] and q['component_gate_passes'],'Component failed: retain all raw observations'
          assert not q['full_engine_qualified'] and not q['full_objective_achieved']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hashing-fused-output-reset-component
          path: benches/results/2026-10-28-hashing-fused-output-reset-component/
          if-no-files-found: error
