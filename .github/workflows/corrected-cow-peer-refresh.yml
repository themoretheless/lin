name: corrected-cow-peer-refresh
on:
  push:
    branches: [codex/corrected-cow-peer-refresh-ci]
permissions:
  contents: read
jobs:
  peers:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify frozen source and harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('benches/results/2026-11-01-corrected-cow-peer-refresh')
          m=json.loads((p/'input.json').read_text())
          for name,digest in m['files_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          c=json.loads(Path('benches/results/2026-11-01-corrected-cow-full-engine/source-inputs.json').read_text())['candidate']['source_sha256']
          assert {str(f):hashlib.sha256(f.read_bytes()).hexdigest()for f in Path('src').rglob('*.rs')}==c
          PY
      - name: Install pinned peer bindings and verify harness contracts
        run: |
          python3 -m pip install -r scripts/bench-peers-requirements.lock
          python3 -m pip freeze > benches/results/2026-11-01-corrected-cow-peer-refresh/python-packages.txt
          python3 scripts/test-bench-peers.py > benches/results/2026-11-01-corrected-cow-peer-refresh/harness-tests.log 2>&1
      - name: Fetch owned server image versions
        run: |
          docker pull postgres:16-alpine
          docker pull mysql:8.4
          docker pull mongo:8.0
      - name: Build exact corrected COW peer executable
        run: python3 benches/results/2026-11-01-corrected-cow-peer-refresh/build.py
      - name: Complete read and native insertion matrices
        run: python3 benches/results/2026-11-01-corrected-cow-peer-refresh/run.py
      - name: Independently audit raw observations and retain all peer outcomes
        run: |
          python3 benches/results/2026-11-01-corrected-cow-peer-refresh/audit.py
          python3 benches/results/2026-11-01-corrected-cow-peer-refresh/write-report.py
      - name: Verify owned containers removed
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('benches/results/2026-11-01-corrected-cow-peer-refresh');f=p/'environment.json'
          if f.exists():
              m=json.loads(f.read_text());checks=[]
              for value in m['containers'].values():
                  r=subprocess.run(['docker','inspect',value['id']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  checks.append(dict(container_id=value['id'],inspect_exit=r.returncode));assert r.returncode==1
              (p/'cleanup-proof.json').write_text(json.dumps(checks,indent=2)+'\n')
          PY
      - name: Enforce all available-peer process wins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path('benches/results/2026-11-01-corrected-cow-peer-refresh/audit.json').read_text())
          for s in a['summary'].values():
              assert s['wins']==s['comparisons'] and s['positive_processes']==s['process_comparisons'],'Available-peer gate failed; preserve all losses'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-cow-peer-refresh
          path: benches/results/2026-11-01-corrected-cow-peer-refresh/
          if-no-files-found: error
