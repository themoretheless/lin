name: cow-bulk-map-template-component
on:
  push:
    branches: [codex/cow-bulk-map-template-ci]
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify frozen source and component assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('benches/results/2026-10-28-cow-bulk-map-template-component')
          for name,digest in json.loads((p/'frozen-inputs.json').read_text()).items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Validate synthetic matrix and failure sensitivity
        run: python3 benches/results/2026-10-28-cow-bulk-map-template-component/test-protocol.py
      - name: Full release suite
        run: python3 benches/results/2026-10-28-cow-bulk-map-template-component/test.py
      - name: Build ordinary paired binaries
        run: python3 benches/results/2026-10-28-cow-bulk-map-template-component/build.py
      - name: Validate all 16 fresh correctness smokes
        run: python3 benches/results/2026-10-28-cow-bulk-map-template-component/smoke.py
      - name: Run 288 isolated paired processes
        run: python3 benches/results/2026-10-28-cow-bulk-map-template-component/run.py
      - name: Recompute complete raw matrix
        run: python3 benches/results/2026-10-28-cow-bulk-map-template-component/analyze.py
      - name: Enforce frozen component gate
        run: |
          python3 - <<'PY'
          import json
          q=json.load(open('benches/results/2026-10-28-cow-bulk-map-template-component/qualification.json'))
          assert q['measurement_complete'] and q['component_gate_passes'],'Component failed: retain all raw observations'
          assert not q['full_engine_qualified'] and not q['full_objective_achieved']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cow-bulk-map-template-component
          path: benches/results/2026-10-28-cow-bulk-map-template-component/
          if-no-files-found: error
