name: Sample kernel CPU during cold row construction
on:
  push:
    branches: [codex/epyc-row-kernel-profile]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - id: cpu
        run: |
          lscpu > cpu.txt
          if grep -Eq 'AMD EPYC (7763|9V74|9V45)' cpu.txt; then echo 'matched=true' >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.cpu.outputs.matched == 'true'
        with:
          toolchain: '1.96.0'
      - if: steps.cpu.outputs.matched == 'true'
        run: |
          cargo build --locked --release -p lin-peer-worker
          python3 scripts/profile-arena-growth.py target/release/lin-peer-worker > arena-growth.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-profile-${{ matrix.replica }}
          path: |
            cpu.txt
            arena-growth.json
