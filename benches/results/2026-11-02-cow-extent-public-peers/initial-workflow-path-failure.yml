name: cow-extent-public-peers
on:
  push:
    branches: [codex/cow-extent-public-peers-ci]
permissions:
  contents: read
  actions: read
jobs:
  peers:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/cow-peer-integrity-v2'
          cache-on-failure: true
      - name: Verify frozen current runtime and complete worker manifest
        run: |
          python3 benches/results/2026-11-02-cow-extent-public-peers/verify-inputs.py
          python3 benches/results/2026-11-02-cow-extent-public-peers/test-manifest.py
      - name: Audit exact upstream current-source Linux correctness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 benches/results/2026-11-02-cow-extent-public-peers/audit-prerequisite.py
      - name: Verify kernel and exact Mongo readiness prerequisite
        run: python3 benches/results/2026-11-02-corrected-cow-extent-public-peers/check-host.py
      - name: Install pinned bindings and verify harness contracts
        run: |
          python3 -m pip install -r scripts/bench-peers-requirements.lock
          python3 -m pip freeze > benches/results/2026-11-02-corrected-cow-extent-public-peers/python-packages.txt
          python3 scripts/test_benchmark_source_integrity.py
          python3 scripts/test-bench-peers.py > benches/results/2026-11-02-corrected-cow-extent-public-peers/harness-tests.log 2>&1
      - name: Fetch exact previously recorded server images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          m=json.loads(Path('benches/results/2026-11-02-corrected-cow-extent-public-peers/input.json').read_text())
          for ref in m['images'].values():subprocess.run(['docker','pull',ref],check=True)
          PY
      - name: Build exact current worker with default plus extent feature
        run: python3 benches/results/2026-11-02-corrected-cow-extent-public-peers/build.py
      - name: Complete read and native insertion matrices
        run: python3 benches/results/2026-11-02-corrected-cow-extent-public-peers/run.py
      - name: Verify owned containers absent
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path('benches/results/2026-11-02-corrected-cow-extent-public-peers');f=p/'environment.json'
          if f.exists():
              m=json.loads(f.read_text());checks=[]
              for value in m['containers'].values():
                  r=subprocess.run(['docker','inspect',value['id']],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  checks.append(dict(container_id=value['id'],inspect_exit=r.returncode));assert r.returncode==1
              (p/'cleanup-proof.json').write_text(json.dumps(dict(containers=checks,all_owned_containers_absent=all(r['inspect_exit']==1 for r in checks)),indent=2)+'\n')
          PY
      - name: Audit all observations values and original processes
        run: |
          python3 benches/results/2026-11-02-corrected-cow-extent-public-peers/audit.py
          python3 benches/results/2026-11-02-corrected-cow-extent-public-peers/verify-processes.py
          python3 benches/results/2026-11-02-corrected-cow-extent-public-peers/write-report.py
      - name: Enforce unchanged available-peer process win gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=json.loads(Path('benches/results/2026-11-02-corrected-cow-extent-public-peers/audit.json').read_text())
          for s in a['summary'].values():
              assert s['wins']==s['comparisons'] and s['positive_processes']==s['process_comparisons'],'Available-peer gate failed; retain all losses'
          PY
      - name: Verify final frozen inputs without overlay or source mutation
        if: always()
        run: python3 benches/results/2026-11-02-cow-extent-public-peers/verify-inputs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cow-extent-public-peers
          path: benches/results/2026-11-02-corrected-cow-extent-public-peers/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cow-extent-public-peers-exact-linux-executable
          path: /tmp/lin-cow-extent-peer-built
          if-no-files-found: warn
