[package]
name = "lin"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lin — язык локальной БД: пайпы, каталог, свой план"
license = "MIT"

[[bin]]
name = "lin"
path = "src/main.rs"

[dependencies]
memchr = "2"
regex = "1.13"
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"

[dev-dependencies]
rbench = { path = "../airbug/bench" }
rusqlite = { version = "0.32", features = ["bundled"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
postgres = "0.19"
mysql = "25"

[[bench]]
name = "compare"
harness = false
