[package]
name = "lin"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lin — язык локальной БД: пайпы, каталог, свой план"
license = "MIT"

[[bin]]
name = "lin"
path = "src/main.rs"

[dependencies]
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rbench = { git = "https://github.com/themoretheless/rbench", branch = "release" }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }

[[bench]]
name = "compare"
harness = false
