[package]
name = "lin"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Lin — язык локальной БД: пайпы, каталог, свой план"
license = "MIT"
readme = "README.md"

[[bin]]
name = "lin"
path = "src/main.rs"

[dependencies]
libc = "0.2"
memchr = "2"
regex = "1.13"
rmp-serde = "1.3"
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"

[dev-dependencies]
rbench = { package = "airbug-bench", path = "../airbug/bench" }
rusqlite = { version = "0.32", features = ["bundled"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
postgres = "0.19"
mysql = "25"

[[bench]]
name = "compare"
harness = false
