[workspace]
members = [".", "lin-derive"]
resolver = "2"

[package]
name = "lin"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Lin — язык локальной БД: пайпы, каталог, свой план"
license = "MIT"
readme = "README.md"

[[bin]]
name = "lin"
path = "src/main.rs"

[features]
default = ["derive", "async"]
derive = ["dep:lin-derive"]
async = ["dep:tokio", "dep:futures-util", "dep:tokio-stream"]
# Neural embedders (opt-in). Default Db still uses HashingEmbedder.
embed-ollama = ["dep:ureq"]
embed-onnx = ["dep:fastembed"]

[dependencies]
libc = "0.2"
memchr = "2"
memmap2 = "0.9"
regex = "1.13"
rmp-serde = "1.3"
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
lin-derive = { path = "lin-derive", version = "0.3.1", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "sync"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", optional = true, default-features = false, features = ["sync"] }
ureq = { version = "3", optional = true, default-features = false, features = ["json", "rustls"] }
fastembed = { version = "6", optional = true, default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }

[dev-dependencies]
airbug = { git = "https://github.com/themoretheless/airbug", branch = "release", package = "airbug", features = ["macros"] }
airbug-bench = { git = "https://github.com/themoretheless/airbug", branch = "release", package = "airbug-bench", features = ["macros"] }
rusqlite = { version = "0.32", features = ["bundled"] }
duckdb = { version = "1.10505.0", features = ["bundled"] }
postgres = "0.19"
mysql = "25"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[[bench]]
name = "compare"
harness = false
