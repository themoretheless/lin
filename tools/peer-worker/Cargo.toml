[package]
name = "lin-peer-worker"
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = ["duckdb-client"]
duckdb-client = ["dep:duckdb"]

[dependencies]
lin = { path = "../.." }
serde_json = "1.0.151"
duckdb = { optional = true, version = "1.10505.0", features = ["bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }
