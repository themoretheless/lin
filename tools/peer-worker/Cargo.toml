[package]
name = "lin-peer-worker"
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
lin = { path = "../.." }
serde_json = "1.0.151"
postgres = "0.19"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "1", features = ["net", "rt"] }
tokio-util = { version = "0.7", features = ["compat"] }
